<ion-header>
  <ion-toolbar>
    <ion-title>Event List</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content>

  <ion-header collapse="condense">
    <ion-toolbar>
      <ion-title>Event List</ion-title>
    </ion-toolbar>
  </ion-header>

  <ion-list>

    <ion-item *ngFor="let event of events">
      <ion-label *ngIf="editingId !== event.id">
        <h2>{{ event.category }}</h2>
        <p>{{ event.description }}</p>
        <p>{{ event.serviceProvider }}</p>
        <p>{{ event.serviceProviderDetails }}</p>
        <p>{{ event.date | date }}</p>
        <p><strong>Cost: </strong>{{ event.cost | currency:'KES' }}</p>
      </ion-label>

       <!-- EDIT MODE -->
  <div *ngIf="editingId === event.id" class="edit-form">
    <ion-input [(ngModel)]="event.category" placeholder="Category"></ion-input>
    <ion-input [(ngModel)]="event.description" placeholder="Description"></ion-input>
    <ion-input [(ngModel)]="event.serviceProvider" placeholder="Provider"></ion-input>
    <ion-input [(ngModel)]="event.serviceProviderDetails" placeholder="Details"></ion-input>
    <ion-input type="number" [(ngModel)]="event.cost" placeholder="Cost"></ion-input>
    <ion-button color="success" (click)="saveUpdate(event)">Save</ion-button>
    <ion-button color="medium" (click)="editingId = null">Cancel</ion-button>
  </div>
       <ion-button *ngIf="editingId !== event.id" color="primary" slot="end" (click)="startEdit(event.id!)">Edit</ion-button>
      <ion-button color="danger" slot="end" (click)="deleteEvent(event.id!)">Delete</ion-button>
    </ion-item>

  </ion-list>

</ion-content>
