<ion-header [translucent]="true">
  <ion-toolbar>
    <ion-title>EventRegistration</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true">
  <ion-header collapse="condense">
    <ion-toolbar>
      <ion-title size="large">EventRegistration</ion-title>
    </ion-toolbar>
  </ion-header>
  <ion-list>
    <ion-item>
      <ion-label position="floating">cost</ion-label>
      <ion-input type="number" min="0" [(ngModel)]="newEvent.cost"></ion-input>
    </ion-item>

    <ion-item>
      <ion-label>Category</ion-label>
      <ion-select [(ngModel)]="newEvent.categoryId" slot="end" interface="popover">
        <ion-select-option *ngFor="let cat of categories" [value]="cat.id">
          {{cat.categoryName}}
        </ion-select-option>
      </ion-select>
    </ion-item>

    <ion-button expand="block" fill="outline" (click)="showNewCategoryForm = !showNewCategoryForm" style="margin: 10px 16px;">
      + Create New Category
    </ion-button>

    <div *ngIf="showNewCategoryForm" style="padding: 16px; background: #f5f5f5; margin: 10px 16px; border-radius: 8px;">
      <ion-item>
        <ion-label position="floating">Category Name</ion-label>
        <ion-input [(ngModel)]="newCategoryName" type="text"></ion-input>
      </ion-item>
      <ion-item>
        <ion-label position="floating">Description (optional)</ion-label>
        <ion-input [(ngModel)]="newCategoryDescription" type="text"></ion-input>
      </ion-item>
      <ion-button expand="block" color="success" (click)="createAndUseCategory()" style="margin-top: 10px;">
        Create & Use
      </ion-button>
      <ion-button expand="block" color="medium" (click)="showNewCategoryForm = false">
        Cancel
      </ion-button>
    </div>

    <ion-item>
      <ion-label position="floating">description</ion-label>
      <ion-input type="text" [(ngModel)]="newEvent.description"></ion-input>
    </ion-item>

    <ion-item>
      <ion-label position="floating">Service Provider</ion-label>
      <ion-input type="text" [(ngModel)]="newEvent.serviceProvider"></ion-input>
    </ion-item>

    <ion-item>
      <ion-label position="floating">Service Provider Details</ion-label>
      <ion-input type="text" [(ngModel)]="newEvent.serviceProviderDetails"></ion-input>
    </ion-item>
  </ion-list>

  <ion-button expand="block" (click)="submitEvent()">Register Event</ion-button>
</ion-content>
